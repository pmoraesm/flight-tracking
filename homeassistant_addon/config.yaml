name: "Flight Tracker"
description: "Track flight prices across nearby airports and get Telegram alerts."
version: "1.2.0"
slug: "flight_tracker"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

options:
  destination: "GRU"
  origins:
    - "AMS"
    - "BRU"
    - "EIN"
    - "RTM"
    - "DUS"
    - "LGG"
  ideal_date: "2026-07-11"
  ideal_return_date: "2026-08-08"
  departure_range_before: 1
  departure_range_after: 2
  return_range_before: 3
  return_range_after: 7
  seat: "economy"
  adults: 2
  children: 1
  price_alert_threshold: 2500
  max_duration_hours: 16
  results_per_query: 3
  interval_minutes: 60
  telegram_bot_token: ""
  telegram_chat_id: ""
  influxdb_host: "a0d7b954-influxdb"
  influxdb_port: 8086
  influxdb_database: "flight_tracker"
  influxdb_username: "flighttracker"
  influxdb_password: "flighttracker"

map:
  - data:rw

schema:
  destination: str
  origins:
    - str
  ideal_date: str
  ideal_return_date: str
  departure_range_before: int
  departure_range_after: int
  return_range_before: int
  return_range_after: int
  seat: "match(economy|premium-economy|business|first)"
  adults: int
  children: int
  price_alert_threshold: int
  max_duration_hours: int
  results_per_query: int
  interval_minutes: int
  telegram_bot_token: str
  telegram_chat_id: str
  influxdb_host: str
  influxdb_port: int
  influxdb_database: str
  influxdb_username: str
  influxdb_password: str
